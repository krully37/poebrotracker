[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stashdisplay"
version = "0.1.0"
description = "Feeds a USB desk display with the stash value computed by WealthyExile (Path of Exile 1)."
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "pillow>=11",
    "pyserial>=3.5",
    "pystray>=0.19",
    "requests>=2.31",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stashdisplay = "stashdisplay.cli:main"

[tool.setuptools.packages.find]
include = ["stashdisplay*"]

[tool.setuptools.package-data]
stashdisplay = ["assets/fonts/*", "web/static/*", "web/static/i18n/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

