; Guition JC3248W535 (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM, AXS15231B QSPI panel)
[platformio]
default_envs = jc3248w535

; Shared by the board's envs.
[esp32]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi

; This platform passes no -O flag at all (unoptimised code: decoders and compositing ~4x slower).
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; USB serial is our own driver (lib/board/usblink.h), not Arduino's Serial
    -DARDUINO_USB_CDC_ON_BOOT=0

extra_scripts = pre:jpegdec_dsp.py
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.9
    bblanchon/ArduinoJson @ ^7.4.0
    bitbank2/JPEGDEC @ ^1.8.2
    bitbank2/AnimatedGIF @ ^2.2.0

; The screen firmware (step 6).
[env:jc3248w535]
extends = esp32
build_src_filter = +<*> -<bench/>
; Made by pc/tools/firmware_assets.py.
board_build.embed_files =
    assets/offline-waiting.ov1z
    assets/offline-disconnected.ov1z

; Step 5 hardware bench: panel, touch, frame rates, decoders, USB speed. See README.md.
; Needs firmware/bench_data/, made by pc/tools/bench_data.py.
[env:bench]
extends = esp32
build_src_filter = -<*> +<bench/>
board_build.embed_files =
    bench_data/bg.rgb565
    bench_data/overlay.ov1z
    bench_data/page.jpg
    bench_data/anim.gif

; Framing tests on the PC: pio test -e native (on Windows, put PlatformIO's MinGW on PATH first,
; see README.md).
[env:native]
platform = native
build_flags = -std=gnu++14
lib_ignore = board
test_build_src = no
