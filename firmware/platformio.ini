; DRAFT: not built yet. Library list will change with the firmware work (see docs/SCOPE.md).
; Guition JC3248W535 (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM, AXS15231B QSPI panel)
[env:jc3248w535]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.9
    bblanchon/ArduinoJson @ ^7.4.0
