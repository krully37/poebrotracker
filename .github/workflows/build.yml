# Builds the Windows app (StashDisplay.exe) and checks the firmware compiles (docs/SCOPE.md §7).
# The .exe is an artifact of each run; a tag "v*" also attaches it to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" pyinstaller
      - run: python -m pytest -q
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: StashDisplay
          path: pc/dist/StashDisplay.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/StashDisplay.exe --generate-notes

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run -e jc3248w535
